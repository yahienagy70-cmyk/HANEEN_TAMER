<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap');

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"DM Sans",Arial,sans-serif}
body{
  min-height:100vh;
  overflow-x:hidden;
  color:#fff;
  background:
    radial-gradient(ellipse at 8% 30%,rgba(62,39,72,.42),transparent 20%),
    radial-gradient(ellipse at 100% 65%,rgba(54,32,65,.30),transparent 23%),
    radial-gradient(circle at 50% 15%,rgba(255,226,255,.20),transparent 25%),
    linear-gradient(145deg,#c3a1cf 0%,#a47cb3 43%,#7b5b84 100%);
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.42;
  background:
    radial-gradient(ellipse at 0% 20%,transparent 0 11%,rgba(52,35,58,.35) 11.5% 12%,transparent 13%),
    radial-gradient(ellipse at 100% 80%,transparent 0 10%,rgba(52,35,58,.25) 10.5% 11.5%,transparent 12%);
  filter:blur(12px);
}
.page{width:min(470px,100%);min-height:100vh;margin:auto;padding:28px 18px 28px;position:relative}
.decor{position:absolute;pointer-events:none;color:#f7ddff;text-shadow:0 0 16px rgba(255,255,255,.55);z-index:1}
.spark{font-size:26px}.heart{font-size:31px}.butterfly{font-size:34px}
.d1{top:150px;left:22px}.d2{top:365px;right:18px}.d3{top:585px;left:34px}
.d4{bottom:145px;right:25px}
.b1{top:115px;right:45px}.b2{bottom:135px;left:23px}
.profile{text-align:center;position:relative;z-index:3;padding-top:34px}
.portrait{
  width:132px;height:132px;margin:0 auto 13px;border-radius:50%;
  padding:5px;
  background:linear-gradient(145deg,#fff0ff,#dcb9e9,#fff0ff);
  box-shadow:0 0 0 6px rgba(255,230,255,.10),0 15px 40px rgba(54,28,65,.34);
}
.portrait svg{width:100%;height:100%;display:block;border-radius:50%;overflow:hidden}
.name{
  margin:0;
  font-family:Caveat,cursive;
  font-size:63px;
  line-height:.95;
  font-weight:500;
  letter-spacing:.2px;
  text-shadow:0 3px 16px rgba(63,33,72,.35);
}
.name-line{display:flex;align-items:center;justify-content:center;gap:12px;margin:8px auto 18px}
.name-line:before,.name-line:after{content:"";height:2px;width:70px;background:rgba(255,230,255,.75);border-radius:99px}
.name-line span{font-size:20px;color:#f7d9ff}
.number{
  font-size:21px;letter-spacing:1.2px;direction:ltr;
  width:min(310px,94%);margin:auto;
  padding:15px 22px;border:1px solid rgba(255,238,255,.6);
  border-radius:999px;background:rgba(255,236,255,.16);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 12px 28px rgba(62,32,72,.2);
  backdrop-filter:blur(14px);
}
.actions{display:flex;gap:11px;width:min(350px,100%);margin:12px auto 0}
.action{
  flex:1;text-decoration:none;color:#fff;
  display:flex;align-items:center;justify-content:center;gap:9px;
  padding:12px;border-radius:999px;
  border:1px solid rgba(255,238,255,.5);
  background:rgba(255,236,255,.15);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 9px 20px rgba(61,32,70,.16);
  backdrop-filter:blur(14px);
  font-size:15px;font-weight:600;
}
.action svg{width:21px;height:21px}
.links{display:grid;gap:15px;margin-top:25px;position:relative;z-index:3}
.card{
  min-height:92px;
  display:grid;grid-template-columns:61px 1fr 42px;align-items:center;
  padding:12px 14px;
  text-decoration:none;color:#fff;text-align:left;
  border:1px solid rgba(255,236,255,.58);
  border-radius:27px;
  background:linear-gradient(110deg,rgba(255,255,255,.20),rgba(255,255,255,.08));
  box-shadow:0 13px 28px rgba(54,28,65,.22),inset 0 1px 0 rgba(255,255,255,.23);
  backdrop-filter:blur(16px);
}
.logo{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;box-shadow:0 7px 16px rgba(42,20,49,.22)}
.logo svg{width:34px;height:34px;display:block}
.ig{background:linear-gradient(145deg,#7540a2,#dd428a 60%,#f5a53d)}
.tt{background:#151118}
.sc{background:#ffe047}
.info{padding:0 11px;min-width:0}
.platform{font-family:Caveat,cursive;font-size:31px;line-height:1}
.handle{font-size:12px;opacity:.84;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:7px;direction:ltr}
.go{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,238,255,.19);border:1px solid rgba(255,238,255,.35);font-size:31px;font-weight:300}
.footer{text-align:center;margin-top:28px;font-family:Caveat,cursive;font-size:27px;color:#f4d9fb}
.footer:before,.footer:after{content:"—";margin:0 10px;opacity:.7}
.footer-heart{display:block;font-family:Arial;font-size:21px;margin-top:3px}
@media(max-width:380px){
 .page{padding-left:13px;padding-right:13px}.name{font-size:56px}
 .card{grid-template-columns:55px 1fr 39px}.logo{width:51px;height:51px}.platform{font-size:28px}
 .handle{font-size:10px}.number{font-size:19px}
}
</style>
